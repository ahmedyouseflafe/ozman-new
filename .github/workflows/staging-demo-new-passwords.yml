# Staging only: new random passwords for demo accounts, written to ~/staging-demo-passwords.txt on the staging host
# (outside the website, readable only by the hosting account). Nothing secret is printed in this log.
name: Staging demo new passwords

on:
  workflow_dispatch:
    inputs:
      emails:
        description: "Demo account emails, space separated (empty: the demo restaurant owner and the demo customer)"
        default: ""
      in_app:
        description: "Write the file inside the staging app (storage/app/private) instead of the home folder"
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Make new passwords on staging
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          EMAILS: ${{ inputs.emails }}
          IN_APP: ${{ inputs.in_app && '--in-app' || '' }}
          HOST: 82.198.227.221
          PORT: 65002
          USER_NAME: u379351114
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed '/^[[:space:]]*$/d' > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          E=$(printf '%s' "$EMAILS" | tr -cd 'A-Za-z0-9@._+ -')
          ssh -i ~/.ssh/staging_key -o IdentitiesOnly=yes -p "$PORT" "$USER_NAME@$HOST" "cd ~/staging-app && php artisan demo:new-passwords $E $IN_APP"
