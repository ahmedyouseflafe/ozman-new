# Asks the shop owner's assistant one question on staging, against the real Claude API, and prints the answer.
name: Staging assistant check

on:
  workflow_dispatch:
    inputs:
      question:
        description: "Question to ask the demo shop's assistant"
        default: "شو أكثر 3 منتجات عندي وأسعارها؟"
      shop:
        description: "Shop slug"
        default: "demo-clothing"
      customer:
        description: "Ask the customers' shopping assistant"
        type: boolean
        default: false
      as_email:
        description: "With customer: the email of the account that asks"
        default: ""
      robot:
        description: "With customer: ask as if spoken to Fulla the robot in the app"
        type: boolean
        default: false
      keep:
        description: "Keep the conversation (it shows in the shop owner's app)"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the assistant on staging
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          QUESTION: ${{ inputs.question }}
          SHOP: ${{ inputs.shop }}
          KEEP: ${{ inputs.keep && '--keep' || '' }}
          CUSTOMER: ${{ inputs.customer && '--customer' || '' }}
          AS_EMAIL: ${{ inputs.as_email }}
          ROBOT: ${{ inputs.robot && '--robot' || '' }}
          HOST: 82.198.227.221
          PORT: 65002
          USER_NAME: u379351114
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed '/^[[:space:]]*$/d' > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          Q64=$(printf '%s' "$QUESTION" | base64 -w0)
          S64=$(printf '%s' "$SHOP" | base64 -w0)
          AS=""
          if [ -n "$AS_EMAIL" ]; then AS="--as=$(printf '%s' "$AS_EMAIL" | tr -cd 'A-Za-z0-9@._+-')"; fi
          ssh -i ~/.ssh/staging_key -o IdentitiesOnly=yes -p "$PORT" "$USER_NAME@$HOST" "cd ~/staging-app && php artisan ozman:assistant-check \"\$(echo $Q64 | base64 -d)\" --shop=\"\$(echo $S64 | base64 -d)\" $KEEP $CUSTOMER $AS $ROBOT"
