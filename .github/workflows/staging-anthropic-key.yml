# Puts the Claude API key on staging without anyone pasting it into a chat or a file manager.
# Set the repository secret STAGING_ANTHROPIC_API_KEY first, then run this workflow by hand.
# The key travels over SSH stdin and is never printed (GitHub masks secrets in the log).
name: Staging Claude key

on:
  workflow_dispatch:

jobs:
  set-key:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write ANTHROPIC_API_KEY into staging .env
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          NEW_KEY: ${{ secrets.STAGING_ANTHROPIC_API_KEY }}
          HOST: 82.198.227.221
          PORT: 65002
          USER_NAME: u379351114
        run: |
          set -e
          NEW_KEY="$(printf '%s' "$NEW_KEY" | tr -d '\r\n ')"
          if [ -z "$NEW_KEY" ]; then echo "::error::Add the repository secret STAGING_ANTHROPIC_API_KEY first."; exit 1; fi
          if ! printf '%s' "$NEW_KEY" | grep -Eq '^sk-ant-[A-Za-z0-9_-]+$'; then echo "::error::The secret doesn't look like a Claude key (sk-ant-...)."; exit 1; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed '/^[[:space:]]*$/d' > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # The key goes in the script text on stdin, not on any command line.
          ssh -i ~/.ssh/staging_key -o IdentitiesOnly=yes -p "$PORT" "$USER_NAME@$HOST" 'bash -s' <<REMOTE
            set -e
            cd ~/staging-app
            export NEW_KEY='$NEW_KEY'
            php -r '\$f = ".env"; \$env = file_get_contents(\$f); \$line = "ANTHROPIC_API_KEY=".getenv("NEW_KEY");
              \$env = preg_match("/^ANTHROPIC_API_KEY=.*\$/m", \$env) ? preg_replace("/^ANTHROPIC_API_KEY=.*\$/m", \$line, \$env) : rtrim(\$env)."\n".\$line."\n";
              file_put_contents(\$f, \$env);'
            php artisan optimize:clear > /dev/null
            grep -c '^ANTHROPIC_API_KEY=sk-ant-' .env > /dev/null && echo "Staging now has a Claude key (ends with ...\${NEW_KEY: -4})."
          REMOTE
