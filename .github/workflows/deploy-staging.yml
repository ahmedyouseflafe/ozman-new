# Updates the staging copy (staging.ozman.online) after every push to main.
# Needs one repository secret: STAGING_SSH_KEY (a private key whose public half is in the
# server's ~/.ssh/authorized_keys). Production is never touched by this workflow.
name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      demo_data:
        description: "Refresh the demo shops and products on staging"
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Update staging over SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST: 82.198.227.221
          PORT: 65002
          USER_NAME: u379351114
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::warning::STAGING_SSH_KEY is not set yet, so staging was not updated."
            exit 0
          fi
          mkdir -p ~/.ssh
          # Keys copied on Windows often carry \r line endings, which OpenSSH rejects.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed '/^[[:space:]]*$/d' > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          if ! ssh-keygen -y -f ~/.ssh/staging_key > /dev/null 2>&1; then
            echo "::error::STAGING_SSH_KEY is not a valid private key. Paste the whole file, from -----BEGIN to -----END, with no passphrase."
            head -c 40 ~/.ssh/staging_key | grep -q 'BEGIN' || echo "::error::The secret does not start with a -----BEGIN line."
            exit 1
          fi
          echo "Key fingerprint: $(ssh-keygen -lf ~/.ssh/staging_key)"
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          DEMO="${{ inputs.demo_data && '1' || '0' }}"
          ssh -i ~/.ssh/staging_key -o IdentitiesOnly=yes -p "$PORT" "$USER_NAME@$HOST" DEMO="$DEMO" 'bash -s' <<'REMOTE'
            set -e
            cd ~/staging-app
            git pull --ff-only origin main
            php artisan migrate --force
            if [ "$DEMO" = "1" ]; then php artisan ozman:demo-data; fi
            php artisan optimize:clear
            echo "Staging is on $(git log -1 --format="%h %s")"
          REMOTE
