# Staging only: sets new passwords on demo accounts, given as bcrypt hashes (the passwords themselves never pass through GitHub).
name: Staging demo passwords

on:
  workflow_dispatch:
    inputs:
      hashes:
        description: "base64 of a JSON object {email: bcrypt hash} (demo accounts only)"
        required: true

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set the passwords on staging
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          HASHES: ${{ inputs.hashes }}
          HOST: 82.198.227.221
          PORT: 65002
          USER_NAME: u379351114
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed '/^[[:space:]]*$/d' > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          H=$(printf '%s' "$HASHES" | tr -cd 'A-Za-z0-9+/=')
          ssh -i ~/.ssh/staging_key -o IdentitiesOnly=yes -p "$PORT" "$USER_NAME@$HOST" "cd ~/staging-app && php artisan demo:set-passwords '$H'"
