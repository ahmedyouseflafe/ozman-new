# Shows whether staging's scheduler runs: the account's cron lines, the scheduled commands, and the latest salon appointments' reminder state.
name: Staging cron check

on:
  workflow_dispatch:
    inputs:
      run_reminders:
        description: "Clear the latest booking's reminder marks and run salon:send-reminders once by hand"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect the scheduler on staging
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST: 82.198.227.221
          PORT: 65002
          USER_NAME: u379351114
          RUN_REMINDERS: ${{ inputs.run_reminders }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed '/^[[:space:]]*$/d' > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/staging_key -o IdentitiesOnly=yes -p "$PORT" "$USER_NAME@$HOST" 'cd ~/staging-app
            if [ "'"$RUN_REMINDERS"'" = true ]; then echo "=== run reminders ==="; php artisan tinker --execute="App\Models\SalonAppointment::latest(\"id\")->first()?->forceFill([\"reminded_day_at\" => null, \"reminded_hour_at\" => null])->save();" >/dev/null 2>&1; date -u +%T; php artisan salon:send-reminders 2>&1; date -u +%T; fi
            echo "=== recent scheduler output ==="; ls -la --time-style=+%H:%M storage/framework/schedule-* 2>/dev/null | tail -3; grep -a "salon\|schedule" storage/logs/laravel.log | tail -3 | cut -c1-300
            echo "=== crontab ==="; crontab -l 2>&1 | grep -v "^#" || true
            echo "=== schedule:list ==="; php artisan schedule:list 2>&1 | head -30
            echo "=== salon reminders ==="; php artisan tinker --execute="foreach (App\Models\SalonAppointment::latest(\"id\")->limit(3)->get() as \$a) echo \$a->id, \" \", \$a->appointment_at, \" status=\", \$a->status, \" day=\", \$a->reminded_day_at ?? \"-\", \" hour=\", \$a->reminded_hour_at ?? \"-\", PHP_EOL;" 2>&1
            echo "=== push devices of the latest booking customer ==="; php artisan tinker --execute="\$u = App\Models\SalonAppointment::latest(\"id\")->value(\"user_id\"); foreach (App\Models\PushDevice::where(\"user_id\", \$u)->get() as \$d) echo \$d->id, \" \", \$d->platform, \" seen=\", \$d->last_seen_at, \" updated=\", \$d->updated_at, PHP_EOL;" 2>&1
            echo "=== now ==="; date -u'
