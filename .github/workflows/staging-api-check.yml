# Calls one app API endpoint on staging as a demo user and prints the answer (plus the end of the log), to test the app's endpoints.
name: Staging API check

on:
  workflow_dispatch:
    inputs:
      method:
        description: "HTTP method"
        default: "GET"
      path:
        description: "Path under /api/v1"
        default: "me"
      shop:
        description: "Act as this shop's owner (slug)"
        default: "demo-clothing"
      user:
        description: "Or act as this user (email)"
        default: ""
      data:
        description: "JSON body"
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the endpoint on staging
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          METHOD: ${{ inputs.method }}
          APIPATH: ${{ inputs.path }}
          SHOP: ${{ inputs.shop }}
          APIUSER: ${{ inputs.user }}
          DATA: ${{ inputs.data }}
          HOST: 82.198.227.221
          PORT: 65002
          USER_NAME: u379351114
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed '/^[[:space:]]*$/d' > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          b() { printf '%s' "$1" | base64 -w0; }
          M=$(b "$METHOD"); P=$(b "$APIPATH"); S=$(b "$SHOP"); U=$(b "$APIUSER"); D=$(b "$DATA")
          ssh -i ~/.ssh/staging_key -o IdentitiesOnly=yes -p "$PORT" "$USER_NAME@$HOST" "cd ~/staging-app && d() { echo \$1 | base64 -d; }; php artisan ozman:api-check \"\$(d $M)\" \"\$(d $P)\" --shop=\"\$(d $S)\" --user=\"\$(d $U)\" --data=\"\$(d $D)\"; echo '--- log ---'; grep -a '^\[20' storage/logs/laravel.log | tail -n 6 | cut -c1-700"
